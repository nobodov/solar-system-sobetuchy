<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa modelu sluneční soustavy</title>
  <meta name="description" content="Mapa pro návrh rozmístění modelu sluneční soustavy kolem Sobětuch: posuňte Slunce, změňte měřítko a uvidíte, kam patří jednotlivé planety.">
  <!-- Link previews (WhatsApp, Facebook, Messenger, X, …); image is generated by tools/make_og_image.py -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="cs_CZ">
  <meta property="og:site_name" content="Sluneční soustava v Sobětuchách">
  <meta property="og:url" content="https://nobodov.github.io/solar-system-sobetuchy/map.html">
  <meta property="og:title" content="Plánovací mapa – sluneční soustava v Sobětuchách">
  <meta property="og:description" content="Mapa pro návrh rozmístění modelu sluneční soustavy kolem Sobětuch: posuňte Slunce, změňte měřítko a uvidíte, kam patří jednotlivé planety.">
  <meta property="og:image" content="https://nobodov.github.io/solar-system-sobetuchy/img/og-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Schéma sluneční soustavy: Slunce a dráhy planet, model v měřítku 1 : 1 000 000 000">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://nobodov.github.io/solar-system-sobetuchy/map.html">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
</head>
<body class="map-page">
  <div id="map" class="map-full"></div>

  <div class="basemap-control">
    <button id="basemap-toggle" class="basemap-toggle" type="button" title="Podkladová mapa"
            aria-label="Podkladová mapa" aria-expanded="false" aria-controls="basemap-menu">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 3 2 8.5l10 5.5 10-5.5L12 3Z" fill="currentColor" opacity="0.9"/>
        <path d="m4.2 12.3-2.2 1.2 10 5.5 10-5.5-2.2-1.2-7.8 4.3-7.8-4.3Z" fill="currentColor" opacity="0.55"/>
      </svg>
    </button>
    <div id="basemap-menu" class="basemap-menu" role="radiogroup" aria-label="Podkladová mapa" hidden>
      <label><input type="radio" name="basemap" value="mapy" checked> Mapy.com (turistická)</label>
      <label><input type="radio" name="basemap" value="osm"> OpenStreetMap</label>
    </div>
  </div>

  <aside id="panel" class="panel">
    <button id="panel-toggle" class="panel-header" type="button" aria-expanded="true" aria-controls="panel-body">
      <span class="panel-handle" aria-hidden="true"></span>
      <span class="panel-title">Model sluneční soustavy</span>
      <span class="panel-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div id="panel-body" class="panel-body">
      <div class="panel-scroll">
      <a class="back-link" href="./">← Zpět na úvod</a>

      <section class="panel-section">
        <h2>Slunce</h2>
        <button id="place-sun" type="button" class="button">Umístit Slunce do mapy</button>
        <p class="hint">Slunce můžete také přetáhnout myší.</p>
        <p class="meta">Poloha: <span id="sun-coords"></span></p>
      </section>

      <section class="panel-section">
        <h2>Měřítko</h2>
        <label class="field">
          <span>Předvolba</span>
          <select id="scale-preset"></select>
        </label>
        <label class="field">
          <span>Vlastní měřítko</span>
          <span class="scale-input">1&nbsp;:&nbsp;<input id="scale-custom" type="text" inputmode="numeric" autocomplete="off"></span>
        </label>
        <label class="field">
          <span>Průměr Slunce v modelu</span>
          <span class="scale-input"><input id="sun-diameter-input" type="text" inputmode="decimal" autocomplete="off">&nbsp;m</span>
        </label>
        <p class="hint">Zadáte-li průměr Slunce, měřítko se dopočítá.</p>
      </section>

      <section class="panel-section">
        <h2>Tělesa</h2>
        <table class="body-table">
          <thead>
            <tr><th></th><th>Těleso</th><th class="num">Vzdálenost</th><th class="num">Průměr</th></tr>
          </thead>
          <tbody id="body-table-body"></tbody>
        </table>
      </section>
      </div>
    </div>
  </aside>

  <script type="module">
    import { initApp } from './js/map.js';
    initApp();
  </script>
</body>
</html>
